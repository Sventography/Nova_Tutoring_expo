# Intentionally manual-only: pushes were generating an email for every
# unfinished change. Run from Actions > Collector 017 > Run workflow.
name: Collector 017 security and app checks
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test requirements
        run: python -m pip install 'Flask>=3.0,<4'
      - name: Compile collector route and tests
        run: python -m py_compile server/collector_redemption.py server/tests/test_collector_redemption.py
      - name: Exercise collector ownership and security rules
        env:
          PYTHONPATH: server
        run: python -m unittest discover -s server/tests -p test_collector_redemption.py -v

  collector-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Expo application dependencies
        run: npm ci --ignore-scripts
      - name: Check TypeScript diagnostics in collector-touched files only
        shell: bash
        run: |
          # The repository-wide tsc currently emits more than 1,000 unrelated
          # errors from legacy/quarantined code; do not misreport this as a
          # full-project pass. Capture diagnostics and require clean touched files.
          npx tsc --noEmit --pretty false > /tmp/nova-tsc.log 2>&1 || true
          if grep -E '^(app/collector/|app/_lib/collectorClient\.ts|app/context/IslandDecorationContext\.tsx|app/components/island3d/IslandDecorationLayer\.tsx)\([0-9]+,[0-9]+\): error TS' /tmp/nova-tsc.log; then
            echo "::error::Collector-touched files have TypeScript errors"
            exit 1
          fi
          echo "::warning::Repository-wide TypeScript has known unrelated errors; touched-file diagnostics only were checked."
          echo "Total repository TS errors: $(grep -c 'error TS' /tmp/nova-tsc.log || true)"
      - name: Export static Expo web route
        run: npx expo export -p web
