name: iOS release candidate (manual)
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed release commit (40-character SHA)
        required: true
        type: string
      mode:
        description: Create a signed build or also upload that exact build to TestFlight
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - testflight

permissions:
  contents: read
concurrency:
  group: ios-release-candidate
  cancel-in-progress: false

jobs:
  release:
    # No pull_request, push, scheduled or production-promotion triggers.
    if: github.ref == 'refs/heads/release/web-ios-working-20260115'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ios-release
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_MODE: ${{ inputs.mode }}
      IOS_APPROVED_SHA: ${{ vars.IOS_APPROVED_SHA }}
      IOS_RELEASE_ENABLED: ${{ vars.IOS_RELEASE_ENABLED }}
      IOS_ASC_APP_ID: ${{ vars.IOS_ASC_APP_ID }}
      EAS_CLI_VERSION: ${{ vars.EAS_CLI_VERSION }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Check release permission and exact source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/test-ios-release-guard.cjs
          node scripts/ios-release-guard.cjs
      - name: Install reviewed dependencies without release secrets
        run: |
          npm ci --ignore-scripts
          npm install --global "eas-cli@$EAS_CLI_VERSION"
          eas --version
      - name: Request signed iOS build for the approved commit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: |
          test -n "$EXPO_TOKEN" || { echo "Missing protected EXPO_TOKEN"; exit 1; }
          if [ "$RELEASE_MODE" = "testflight" ]; then
            eas build --platform ios --profile production --non-interactive --freeze-credentials --auto-submit-with-profile production
          else
            eas build --platform ios --profile production --non-interactive --freeze-credentials
          fi
      - name: Record release candidate scope
        if: always()
        run: |
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Requested mode: $RELEASE_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "Check EAS build and submission status separately. This workflow never submits for public App Review." >> "$GITHUB_STEP_SUMMARY"
